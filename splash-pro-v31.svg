<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 760" role="img" aria-label="Personaje anime mágico saludando">
  <defs>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset=".38" stop-color="#ffd45e"/>
      <stop offset=".72" stop-color="#f2b93f"/>
      <stop offset="1" stop-color="#bf7b20"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#fff6ef"/>
      <stop offset=".55" stop-color="#f7cfc0"/>
      <stop offset="1" stop-color="#e9aa98"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#201d52"/>
      <stop offset="1" stop-color="#09091e"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8fc9"/>
      <stop offset=".55" stop-color="#ff4fa3"/>
      <stop offset="1" stop-color="#d71c79"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1a5"/>
      <stop offset=".4" stop-color="#ffd75f"/>
      <stop offset="1" stop-color="#c88a1e"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="42%" r="58%">
      <stop offset="0" stop-color="#ff67b6" stop-opacity=".28"/>
      <stop offset=".55" stop-color="#8b5cff" stop-opacity=".10"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000" flood-opacity=".42"/>
    </filter>
    <style>
      .enter{transform-origin:260px 380px;animation:enter 3.2s cubic-bezier(.16,.84,.24,1) both}
      .body{transform-origin:260px 360px;animation:breathe 2.8s .55s ease-in-out both}
      .tailL{transform-origin:193px 134px;animation:tailL 2.6s .5s ease-in-out both}
      .tailR{transform-origin:327px 134px;animation:tailR 2.45s .5s ease-in-out both}
      .upper{transform-origin:344px 328px;animation:upper 1.25s .72s cubic-bezier(.2,.02,.16,1) both}
      .fore{transform-origin:389px 258px;animation:fore 1.35s .78s cubic-bezier(.2,.02,.16,1) both}
      .hand{transform-origin:418px 174px;animation:wave 1.2s 1.08s cubic-bezier(.3,.03,.16,1) both}
      .blink{animation:blink 2.2s 1.1s ease both;transform-origin:center}
      .wink{opacity:0;animation:wink 2.2s 1.1s ease both}
      .sparkA{animation:spark 1.2s .3s ease-in-out infinite alternate;transform-origin:center}
      .sparkB{animation:spark 1.5s .7s ease-in-out infinite alternate;transform-origin:center}
      .sparkC{animation:spark 1.35s .5s ease-in-out infinite alternate;transform-origin:center}
      @keyframes enter{0%{opacity:0;transform:translateY(34px) scale(.94)}20%{opacity:1}100%{opacity:1;transform:translateY(0) scale(1)}}
      @keyframes breathe{0%{transform:translateY(0) rotate(0)}35%{transform:translateY(-4px) rotate(-.45deg)}70%{transform:translateY(-2px) rotate(.35deg)}100%{transform:translateY(0) rotate(0)}}
      @keyframes tailL{0%{transform:rotate(0)}40%{transform:rotate(-3.2deg)}75%{transform:rotate(2.2deg)}100%{transform:rotate(0)}}
      @keyframes tailR{0%{transform:rotate(0)}38%{transform:rotate(3.7deg)}72%{transform:rotate(-2.6deg)}100%{transform:rotate(0)}}
      @keyframes upper{0%{transform:rotate(28deg)}35%{transform:rotate(12deg)}68%{transform:rotate(-3deg)}100%{transform:rotate(0)}}
      @keyframes fore{0%{transform:rotate(18deg)}38%{transform:rotate(6deg)}70%{transform:rotate(-7deg)}100%{transform:rotate(0)}}
      @keyframes wave{0%{transform:rotate(-6deg)}16%{transform:rotate(18deg)}32%{transform:rotate(-17deg)}48%{transform:rotate(19deg)}64%{transform:rotate(-15deg)}80%{transform:rotate(13deg)}92%{transform:rotate(-6deg)}100%{transform:rotate(0)}}
      @keyframes blink{0%,38%,58%,100%{opacity:1}43%,53%{opacity:0}}
      @keyframes wink{0%,38%,58%,100%{opacity:0}43%,53%{opacity:1}}
      @keyframes spark{from{opacity:.3;transform:scale(.72) rotate(0)}to{opacity:1;transform:scale(1.25) rotate(16deg)}}
    </style>
  </defs>

  <g class="enter" filter="url(#shadow)">
    <ellipse cx="260" cy="330" rx="220" ry="250" fill="url(#halo)"/>
    <circle cx="260" cy="310" r="188" fill="none" stroke="#ff58ac" stroke-width="2.4" opacity=".5"/>
    <circle cx="260" cy="310" r="158" fill="none" stroke="#ffd86b" stroke-width="1.2" opacity=".18"/>

    <g class="sparkA" filter="url(#softGlow)" fill="#ffe88e"><path d="M84 178l6 16l16 6l-16 6l-6 16l-6-16l-16-6l16-6z"/></g>
    <g class="sparkB" filter="url(#softGlow)" fill="#ff67b6"><path d="M437 248l5 13l13 5l-13 5l-5 13l-5-13l-13-5l13-5z"/></g>
    <g class="sparkC" filter="url(#softGlow)" fill="#fff"><path d="M414 92l4 10l10 4l-10 4l-4 10l-4-10l-10-4l10-4z"/></g>

    <g class="body">
      <g class="tailL">
        <path d="M202 143C132 166 89 228 88 319C87 420 126 511 67 618C153 587 202 498 208 404C214 307 180 222 221 165Z" fill="url(#hair)" stroke="#a86f1f" stroke-width="3.5"/>
        <path d="M194 164C138 216 126 302 144 381C155 429 164 479 139 532" fill="none" stroke="#fff1a0" stroke-width="5" opacity=".34"/>
      </g>
      <g class="tailR">
        <path d="M318 143C390 165 434 228 436 318C438 419 397 510 456 616C369 587 319 498 312 405C305 306 340 222 299 165Z" fill="url(#hair)" stroke="#a86f1f" stroke-width="3.5"/>
        <path d="M326 164C383 216 395 303 376 382C365 429 356 478 381 532" fill="none" stroke="#fff1a0" stroke-width="5" opacity=".34"/>
      </g>

      <circle cx="210" cy="126" r="34" fill="url(#hair)" stroke="#ad7420" stroke-width="3.5"/>
      <circle cx="310" cy="126" r="34" fill="url(#hair)" stroke="#ad7420" stroke-width="3.5"/>
      <circle cx="210" cy="126" r="9" fill="#ff4fa3" stroke="#ffd96b" stroke-width="2"/>
      <circle cx="310" cy="126" r="9" fill="#ff4fa3" stroke="#ffd96b" stroke-width="2"/>

      <path d="M189 159Q260 112 331 159L325 226Q260 258 195 226Z" fill="url(#hair)" stroke="#a96e1f" stroke-width="3"/>
      <ellipse cx="260" cy="214" rx="70" ry="82" fill="url(#skin)" stroke="#cc9484" stroke-width="2.4"/>
      <path d="M193 206C195 159 221 136 260 135C302 136 328 161 327 207C307 180 285 168 260 166C235 166 214 180 193 206Z" fill="url(#hair)" stroke="#a96e1f" stroke-width="3"/>
      <path d="M211 181Q230 158 249 158Q238 179 230 200Z" fill="#f7c84d"/>
      <path d="M309 181Q291 158 271 158Q282 180 290 200Z" fill="#f7c84d"/>

      <path d="M218 214Q232 201 246 214Q232 229 218 214Z" fill="#2957b8"/>
      <circle cx="233" cy="212" r="5" fill="#fff"/>
      <g class="blink"><path d="M274 214Q288 201 302 214Q288 229 274 214Z" fill="#2957b8"/><circle cx="289" cy="212" r="5" fill="#fff"/></g>
      <path class="wink" d="M275 216Q289 226 302 214" fill="none" stroke="#6e4450" stroke-width="4" stroke-linecap="round"/>
      <path d="M244 247Q260 260 277 246" fill="none" stroke="#d95c7f" stroke-width="4" stroke-linecap="round"/>
      <ellipse cx="211" cy="239" rx="11" ry="7" fill="#ff7da9" opacity=".18"/>
      <ellipse cx="309" cy="239" rx="11" ry="7" fill="#ff7da9" opacity=".18"/>

      <path d="M239 294Q260 285 281 294L283 324Q260 337 237 324Z" fill="url(#skin)"/>
      <path d="M182 337Q260 299 338 337L349 462Q260 500 171 462Z" fill="url(#navy)" stroke="#4c4788" stroke-width="3"/>
      <path d="M196 330L260 379L324 330L311 382L260 404L208 382Z" fill="#fff8ff"/>
      <path d="M220 380L260 399L300 380L289 422L260 406L231 422Z" fill="url(#pink)"/>
      <circle cx="260" cy="404" r="12" fill="url(#gold)" stroke="#9a6416" stroke-width="2.5"/>
      <path d="M236 311L260 289L284 311L273 320L260 315L247 320Z" fill="url(#gold)" stroke="#9a6416" stroke-width="2.2"/>
      <circle cx="260" cy="304" r="6" fill="#ff4fa3"/>

      <path d="M170 458L350 458L387 529Q260 572 133 529Z" fill="url(#pink)" stroke="#c42778" stroke-width="3"/>
      <path d="M154 516Q260 551 366 516" fill="none" stroke="#ffd96f" stroke-width="4" opacity=".8"/>

      <path d="M189 351Q151 374 142 425" fill="none" stroke="url(#skin)" stroke-width="28" stroke-linecap="round"/>
      <path d="M143 425Q137 459 126 486" fill="none" stroke="url(#skin)" stroke-width="24" stroke-linecap="round"/>
      <ellipse cx="124" cy="493" rx="14" ry="17" fill="url(#skin)"/>

      <path d="M206 530L194 682" stroke="url(#skin)" stroke-width="34" stroke-linecap="round"/>
      <path d="M314 530L326 682" stroke="url(#skin)" stroke-width="34" stroke-linecap="round"/>
      <path d="M176 666Q198 653 219 666L220 707H166Z" fill="#fff" stroke="#ff5da9" stroke-width="4"/>
      <path d="M301 666Q323 653 345 666L354 707H298Z" fill="#fff" stroke="#ff5da9" stroke-width="4"/>
      <path d="M168 691H220M299 691H351" stroke="#241f53" stroke-width="5"/>

      <path d="M244 135L260 118L276 135L268 145H252Z" fill="url(#gold)" stroke="#9a6416" stroke-width="2"/>
      <circle cx="260" cy="134" r="5" fill="#ff4fa3"/>
    </g>

    <g class="upper">
      <path d="M334 348Q358 317 374 286Q383 268 389 250" fill="none" stroke="url(#skin)" stroke-width="28" stroke-linecap="round"/>
      <path d="M336 349Q357 324 371 294" fill="none" stroke="#fff" stroke-width="34" stroke-linecap="round" opacity=".16"/>
      <g class="fore">
        <path d="M389 250Q404 217 412 181Q415 166 417 151" fill="none" stroke="url(#skin)" stroke-width="25" stroke-linecap="round"/>
        <g class="hand">
          <ellipse cx="418" cy="145" rx="16" ry="19" fill="url(#skin)"/>
          <path d="M411 142L399 117M416 139L411 110M421 139L424 108M426 142L438 116M429 148L447 134" stroke="#f1b5a5" stroke-width="7" stroke-linecap="round"/>
        </g>
      </g>
    </g>
  </g>
</svg>