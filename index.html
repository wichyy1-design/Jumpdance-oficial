<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#080711">
<meta name="description" content="Aplicación oficial de Jumpdance 2026: inscripciones, novedades, fotos, videos y resultados.">
<meta name="application-name" content="Jumpdance 2026">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jumpdance">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<title>Jumpdance 2026</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="gallery-v25.css">
<link rel="stylesheet" href="mobile-fit-v25.css">
<link rel="stylesheet" href="admin-v26.css">
<link rel="stylesheet" href="splash-v27.css">
</head>
<body>
<div id="jdSplash" class="jdSplash" aria-hidden="true">
  <div class="jdSplashInner">
    <div class="jdSplashMark">★</div>
    <h1 class="jdSplashLogo">JUMPDANCE <span class="jdSplashYear">2026</span></h1>
    <div class="jdSplashLine"></div>
  </div>
</div>
<script src="splash-v27.js"></script>

<header class="topbar">
  <button id="menuBtn" class="iconBtn">☰</button>
  <div class="brandBlock"><div class="brand">JUMPDANCE <span>2026</span></div><small>Evento de exhibición</small></div>
  <button class="iconBtn" onclick="route('news')">🔔</button>
</header>

<main id="app"></main>

<nav class="bottomNav">
  <button data-route="home" onclick="route('home')">🏠<small>Inicio</small></button>
  <button data-route="register" onclick="route('register')">📅<small>Evento</small></button>
  <button data-route="results" onclick="route('results')">👑<small>Jumpdance</small></button>
  <button data-route="messages" onclick="route('messages')">✉️<small>Contacto</small></button>
  <button data-route="admin" onclick="route('admin')">👤<small>Mi cuenta</small></button>
</nav>

<div id="drawer" class="drawer hidden">
  <div class="drawerPanel">
    <button class="close" onclick="closeDrawer()">×</button>
    <h2>JUMPDANCE <span>2026</span></h2>
    <button onclick="route('home');closeDrawer()">🏠 Inicio</button>
    <button onclick="route('register');closeDrawer()">📝 Inscripciones</button>
    <button onclick="route('photos');closeDrawer()">📸 Fotos</button>
    <button onclick="route('videos');closeDrawer()">🎬 Videos</button>
    <button onclick="route('news');closeDrawer()">📢 Novedades</button>
    <button onclick="route('results');closeDrawer()">🏆 Resultados</button>
    <button onclick="route('sponsors');closeDrawer()">⭐ Sponsors</button>
    <button onclick="route('messages');closeDrawer()">💬 Mensajes públicos</button>
    <button onclick="route('admin');closeDrawer()">🔐 Administrador</button>
  </div>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
window.JD_RESTORE_ADMIN_ROUTE=location.hash==='#admin';
if(window.JD_RESTORE_ADMIN_ROUTE)history.replaceState(history.state,'','#home');
</script>
<script src="app.js"></script>
<script src="gallery-v25.js"></script>
<script>
if(window.JD_RESTORE_ADMIN_ROUTE)history.replaceState(history.state,'','#admin');
</script>
<script src="navigation-v25.js"></script>
<script src="admin-v26.js"></script>
<script src="username-auth-v26.js"></script>
<script src="admin-modules-v26.js"></script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/service-worker.js').catch(console.error);
  });
}
</script>

</body>
</html>
